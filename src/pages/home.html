<div x-data="textVisualizer" class="flex flex-1 flex-col items-center justify-center p-6">

    <!-- Input view -->
    <div x-show="!activeMode" class="flex w-full max-w-sm flex-col gap-5">
        <input
            type="text"
            x-model="text"
            placeholder="Type something..."
            class="input input-bordered w-full text-base"
            data-testid="visualizer-input"
        />

        <div class="grid grid-cols-2 gap-3">
            <button
                type="button"
                @click="open('qr')"
                :disabled="!text.trim()"
                class="flex h-20 flex-col items-center justify-center gap-1.5 rounded-xl border border-base-300 bg-base-100 text-sm font-medium transition-colors hover:bg-base-200 disabled:cursor-not-allowed disabled:opacity-30"
                data-testid="mode-qr"
            >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 013.75 9.375v-4.5zM3.75 14.625c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 01-1.125-1.125v-4.5zM13.5 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0113.5 9.375v-4.5z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 6.75h.75v.75h-.75v-.75zM6.75 16.5h.75v.75h-.75V16.5zM16.5 6.75h.75v.75h-.75v-.75zM13.5 13.5h.75v.75h-.75v-.75zM13.5 18.75h.75v.75h-.75v-.75zM18.75 13.5h.75v.75h-.75v-.75zM18.75 18.75h.75v.75h-.75v-.75zM16.5 16.5h.75v.75h-.75V16.5z" />
                </svg>
                QR Code
            </button>

            <button
                type="button"
                @click="open('large')"
                :disabled="!text.trim()"
                class="flex h-20 flex-col items-center justify-center gap-1.5 rounded-xl border border-base-300 bg-base-100 text-sm font-medium transition-colors hover:bg-base-200 disabled:cursor-not-allowed disabled:opacity-30"
                data-testid="mode-large"
            >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 01.865-.501 48.172 48.172 0 003.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z" />
                </svg>
                Large Text
            </button>

            <button
                type="button"
                @click="open('marquee')"
                :disabled="!text.trim()"
                class="flex h-20 flex-col items-center justify-center gap-1.5 rounded-xl border border-base-300 bg-base-100 text-sm font-medium transition-colors hover:bg-base-200 disabled:cursor-not-allowed disabled:opacity-30"
                data-testid="mode-marquee"
            >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" />
                </svg>
                Marquee
            </button>

            <button
                type="button"
                @click="open('blink')"
                :disabled="!text.trim()"
                class="flex h-20 flex-col items-center justify-center gap-1.5 rounded-xl border border-base-300 bg-base-100 text-sm font-medium transition-colors hover:bg-base-200 disabled:cursor-not-allowed disabled:opacity-30"
                data-testid="mode-blink"
            >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
                </svg>
                Blink
            </button>
        </div>
    </div>

    <!-- Fullscreen overlay -->
    <div
        x-show="activeMode"
        x-cloak
        @keydown.escape.window="close()"
        class="fixed inset-0 z-50 flex items-center justify-center overflow-hidden bg-base-100"
        data-testid="fullscreen-overlay"
    >
        <button
            type="button"
            @click="close()"
            class="absolute right-3 top-3 z-10 btn btn-ghost btn-sm btn-circle opacity-40 hover:opacity-100"
            aria-label="Close"
            data-testid="close-btn"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>

        <!-- QR Code: square filling the smaller viewport dimension -->
        <div
            x-show="activeMode === 'qr'"
            x-cloak
            x-html="qrSvg"
            class="[&>svg]:block [&>svg]:h-full [&>svg]:w-full"
            style="width: 100vmin; height: 100vmin;"
            data-testid="view-qr"
        ></div>

        <!-- Large Text: fitText scales to fill the full viewport -->
        <p
            x-show="activeMode === 'large'"
            x-cloak
            x-ref="largeText"
            x-text="text"
            class="w-full break-words text-center font-bold leading-none"
            data-testid="view-large"
        ></p>

        <!-- Marquee -->
        <div
            x-show="activeMode === 'marquee'"
            x-cloak
            class="flex w-full flex-col"
            data-testid="view-marquee"
        >
            <div class="overflow-hidden">
                <div
                    x-ref="marqueeEl"
                    class="animate-marquee inline-flex font-bold leading-none"
                    :style="`font-size: 100vh; animation-duration: ${marqueeDuration}s`"
                >
                    <span x-ref="marqueeSpan" x-text="text" class="shrink-0 pr-[0.5em]"></span>
                    <span x-text="text" class="shrink-0 pr-[0.5em]"></span>
                </div>
            </div>
            <!-- Speed control -->
            <div class="absolute bottom-4 left-1/2 flex -translate-x-1/2 items-center gap-3 rounded-full border border-base-300 bg-base-100/80 px-4 py-2 backdrop-blur-sm">
                <span class="text-xs opacity-50">fast</span>
                <input
                    type="range"
                    min="2"
                    max="30"
                    step="1"
                    x-model.number="marqueeDuration"
                    class="range range-xs w-28"
                    data-testid="marquee-speed"
                    aria-label="Marquee speed"
                />
                <span class="text-xs opacity-50">slow</span>
            </div>
        </div>

        <!-- Blink: fitText scales to fill the full viewport -->
        <p
            x-show="activeMode === 'blink'"
            x-cloak
            x-ref="blinkText"
            x-text="text"
            class="w-full animate-blink break-words text-center font-bold leading-none"
            data-testid="view-blink"
        ></p>
    </div>

</div>
