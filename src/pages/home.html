<div x-data="textVisualizer" class="flex flex-1 flex-col items-center justify-center p-6">

    <!-- Input + controls view -->
    <div x-show="!activeMode" class="flex w-full max-w-md flex-col gap-5">
        <input
            type="text"
            x-model="text"
            placeholder="Type something..."
            class="input input-bordered w-full text-base"
            data-testid="visualizer-input"
        />

        <!-- Mode selector — rendered from the registry (src/modes.ts) -->
        <div class="grid grid-cols-2 gap-3 sm:grid-cols-3">
            <template x-for="m in modes" :key="m.id">
                <button
                    type="button"
                    @click="open(m.id)"
                    :disabled="!text.trim()"
                    :data-testid="'mode-' + m.id"
                    class="flex h-20 flex-col items-center justify-center gap-1.5 rounded-xl border border-base-300 bg-base-100 text-sm font-medium transition-colors hover:bg-base-200 disabled:cursor-not-allowed disabled:opacity-30"
                >
                    <span x-html="m.icon"></span>
                    <span x-text="m.label"></span>
                </button>
            </template>
        </div>

        <!-- Controls (all live here; the fullscreen view is chrome-free) -->
        <div class="flex flex-col gap-4 rounded-xl border border-base-300 bg-base-100 p-4">
            <!-- Speed: one knob shared by marquee, blink and morse -->
            <label class="flex items-center gap-3 text-sm">
                <span class="w-16 shrink-0 opacity-70">Speed</span>
                <span class="text-xs opacity-50">slow</span>
                <input
                    type="range"
                    min="1"
                    max="10"
                    step="1"
                    x-model.number="speed"
                    class="range range-xs flex-1"
                    data-testid="control-speed"
                    aria-label="Animation speed"
                />
                <span class="text-xs opacity-50">fast</span>
            </label>

            <!-- Colors / contrast -->
            <div class="flex items-center gap-3 text-sm">
                <span class="w-16 shrink-0 opacity-70">Colors</span>
                <label class="flex items-center gap-2">
                    <input type="color" x-model="color" class="h-7 w-9 cursor-pointer rounded border border-base-300 bg-base-100" data-testid="control-color" aria-label="Text color" />
                    <span class="text-xs opacity-50">text</span>
                </label>
                <label class="flex items-center gap-2">
                    <input type="color" x-model="bg" class="h-7 w-9 cursor-pointer rounded border border-base-300 bg-base-100" data-testid="control-bg" aria-label="Background color" />
                    <span class="text-xs opacity-50">bg</span>
                </label>
                <button type="button" @click="swapColors()" class="btn btn-ghost btn-sm btn-circle ml-auto" data-testid="control-swap" aria-label="Swap colors" title="Swap colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h14m0 0l-4-4m4 4l-4 4M21 17H7m0 0l4-4m-4 4l4 4" />
                    </svg>
                </button>
            </div>

            <!-- Orientation: defaults to vertical on phones -->
            <div class="flex items-center gap-3 text-sm">
                <span class="w-16 shrink-0 opacity-70">Layout</span>
                <div class="join" role="group" aria-label="Orientation">
                    <button type="button" @click="orientation = 'horizontal'" :class="orientation === 'horizontal' ? 'btn-active' : ''" class="btn btn-sm join-item" data-testid="orient-horizontal">Horizontal</button>
                    <button type="button" @click="orientation = 'vertical'" :class="orientation === 'vertical' ? 'btn-active' : ''" class="btn btn-sm join-item" data-testid="orient-vertical">Vertical</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Fullscreen view — only the visualization + a close button -->
    <div
        x-ref="overlay"
        x-show="activeMode"
        x-cloak
        @keydown.escape.window="close()"
        class="fixed inset-0 z-50 flex select-none items-center justify-center overflow-hidden"
        :style="{ background: bg, color: color }"
        data-testid="fullscreen-overlay"
    >
        <button
            type="button"
            @click="close()"
            class="absolute right-3 top-3 z-10 btn btn-ghost btn-sm btn-circle opacity-30 hover:opacity-100"
            aria-label="Close"
            data-testid="close-btn"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>

        <!-- Stage: rotated 90° (and dimension-swapped) for vertical layout so
             text fills a portrait screen along its long axis. -->
        <div
            class="relative flex shrink-0 items-center justify-center overflow-hidden"
            :class="orientation === 'vertical' ? 'rotate-90' : ''"
            :style="orientation === 'vertical' ? 'width:100vh;height:100vw' : 'width:100vw;height:100vh'"
        >
            <!-- QR Code: square filling the smaller dimension -->
            <div
                x-show="activeMode === 'qr'"
                x-cloak
                x-html="qrSvg"
                class="[&>svg]:block [&>svg]:h-full [&>svg]:w-full"
                style="width: 100vmin; height: 100vmin;"
                data-testid="view-qr"
            ></div>

            <!-- Large Text -->
            <p
                x-show="activeMode === 'large'"
                x-cloak
                x-ref="largeText"
                x-text="text"
                class="w-full break-words text-center font-bold leading-none"
                data-testid="view-large"
            ></p>

            <!-- Mirror Text -->
            <p
                x-show="activeMode === 'mirror'"
                x-cloak
                x-ref="mirrorText"
                x-text="text"
                class="w-full break-words text-center font-bold leading-none"
                style="transform: scaleX(-1)"
                data-testid="view-mirror"
            ></p>

            <!-- Marquee -->
            <div x-show="activeMode === 'marquee'" x-cloak class="w-full overflow-hidden" data-testid="view-marquee">
                <div
                    x-ref="marqueeEl"
                    class="animate-marquee inline-flex font-bold leading-none"
                    :style="`font-size:${marqueeFontPx}px; animation-duration:${marqueeDuration}s;` + (marqueeDist ? ` --marquee-dist:${marqueeDist}px;` : '')"
                >
                    <span x-ref="marqueeSpan" x-text="text" class="shrink-0 pr-[0.5em]"></span>
                    <span x-text="text" class="shrink-0 pr-[0.5em]"></span>
                </div>
            </div>

            <!-- Blink -->
            <p
                x-show="activeMode === 'blink'"
                x-cloak
                x-ref="blinkText"
                x-text="text"
                class="w-full animate-blink break-words text-center font-bold leading-none"
                :style="{ animationDuration: blinkDuration + 's' }"
                data-testid="view-blink"
            ></p>

            <!-- Morse: a lamp that flashes the message, with the code below -->
            <div x-show="activeMode === 'morse'" x-cloak class="flex h-full w-full flex-col items-center justify-center gap-[6vmin]" data-testid="view-morse">
                <div
                    class="rounded-full transition-opacity duration-75"
                    :style="`width:42vmin; height:42vmin; background:currentColor; opacity:${morseOn ? 1 : 0.08}`"
                ></div>
                <div x-text="morseCode" class="max-w-[90vw] break-all text-center font-mono text-[4vmin] tracking-[0.3em] opacity-70"></div>
            </div>
        </div>
    </div>

</div>
